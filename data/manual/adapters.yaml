# 어댑터 정찰 기록 (§8 프로토콜). 실제 코드는 아직 없음 — T7에서 이 기록 기반으로 구현.
# 8개 미커버 구(종로/중랑/성북/강북/노원/서대문/금천/관악) 중 실제 사이트 접속까지 확인한 것만.

동대문구시설관리공단_dfmc:
  url: https://www.dfmc.kr:8443/course/sports/fmcs/14
  robots: "허용 (/customer/, /admin/ 등만 차단, /course/는 열림)"
  유형: "JSON API (SPA급) — 최우선 후보"
  확인사항: |
    로그인/인증키 없이 REST GET으로 실시간 슬롯 상태 조회 가능:
      GET /course/sports/rest/facilities/place_month_state_list?company_code={comcd}&part_code={부코드}&place_code={장소코드}&base_date=YYYYMMDD&memno=00000000
      GET /course/sports/rest/facilities/place_time_state_list?company_code=...&base_date=YYYYMMDD&memno=00000000
    응답 필드: date, part_nm(구장명), place_nm, time_no, time_nm("1부"~), start_time/end_time(HH:MM),
      use_yn(Y=예약됨/N=비어있음), time_status_nm(예약자 실명 — ⚠️개인정보, 절대 저장 금지, 무시하고 버릴 것)
    company_code=DFMC09 확인됨(중랑천체육시설 관할 — 동대문구 아니라 중랑구 소재 시설도 이 사이트에서 관리)
  실존 구장:
    - "겸재교 풋살장" (part_cd=02, place_cd=1) — 중랑구 소재
    - "이화교 풋살장" — 중랑구 소재, 코드 미확인
    - 동대문구민체육센터/이문체육문화센터 산하에도 시설 있을 수 있음 — 미확인
  다음 확인 필요: company_code/part_code/place_code 전체 목록 뽑아내는 엔드포인트가 있는지
    (place_month_state_list 응답에 place 목록이 포함되는지, 아니면 별도 /rest/common/place 류가 있는지)

종로구시설관리공단_ijongno:
  url: https://www.ijongno.co.kr/fmcs/66
  robots: "User-agent: * / Allow: / — 전체 허용"
  유형: "서버렌더 HTML (GET 쿼리파라미터 기반, XHR 아님)"
  확인사항: |
    "대관예약" 메뉴(/fmcs/4)에서 센터/시설/장소 선택 시 URL이
      /fmcs/4?facilities_type=C&base_date=YYYYMMDD&rent_type=1001&center={코드}&part={코드}&place={코드}
    형태로 GET 이동하며 캘린더가 서버에서 렌더링된 HTML로 옴. 로그인 없이 조회 가능.
    범례: 신청(미승인)/신청(입금대기)/예약완료/예약불가/예약가능 5단계 — SlotStatus 매핑 가능
    한강다목적운동장 = center: JONGNO06, 천연 잔디 축구장 A/B 확인(place=3이 A로 보임)
    /rest/common/company, /rest/common/part, /rest/common/place — POST REST 있으나 드롭다운
    옵션 로딩용으로 보임(캘린더 데이터 자체는 아님). 실제 슬롯 상태는 HTML cheerio 파싱 필요.
  실존 구장:
    - 한강다목적운동장 천연잔디축구장 A/B (한강 인근)
  오픈규칙: "신청기간: 신청 월 전월 20일부터 25일까지, 매월 접수" — open-schedule.yaml MONTHLY_DAY 후보
    (단, "대관심의: 축구 경기에 한하여 승인" — 선착순 아니라 심의 방식으로 보임, allocation 재확인 필요)

