노원구시설관리공단_nowonsc:
  url: https://reservation.nowonsc.kr
  robots: "robots.txt 없음(홈으로 리다이렉트) — 명시적 차단 없음"
  유형: "로그인 필수 → LINK_ONLY"
  확인사항: "대관현황 버튼 클릭 시 /member/login으로 강제 리다이렉트됨. 시설 목록·주소·전화는 로그인 없이 보임"
  실존 구장: "마들/초안산/불암산/수락산 스포츠타운 축구장 4곳 (주소·전화 확인됨)"
  오픈규칙: "야외체육시설 익월대관 매월 19일 오픈(관내회원 우선, 팀등록 후 예약)" — 홈 배너에서 확인

