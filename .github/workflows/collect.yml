name: 데이터 수집

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 09:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 공공데이터 수집
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SEOUL_OPEN_DATA_API_KEY: ${{ secrets.SEOUL_OPEN_DATA_API_KEY }}
        run: |
          npm run fetch:facility
          npm run fetch:seoul

      - name: 데이터셋 빌드
        run: npm run build:dataset

      - name: 변경 시 자동 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/venues.json; then
            echo "변경 없음"
          else
            git add data/venues.json
            git commit -m "chore: 공공데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
